# The sign-in and registration pages, in the style of the sample pages
# (login.html, register.html). Keycloak's base theme renders the forms; the
# classes below give them the samples' Tailwind classes. Build the stylesheet
# with `npm run keycloak-theme:build` in the repository root.
parent=base
import=common/keycloak
locales=en
styles=css/styles.css
meta=viewport==width=device-width,initial-scale=1

kcHtmlClass=h-full bg-white
kcBodyClass=flex min-h-full flex-col

kcFormGroupClass=mt-6
kcFormGroupErrorClass=
kcLabelWrapperClass=
kcLabelClass=block text-sm font-semibold text-gray-800
kcInputWrapperClass=
kcInputClass=mt-2 block w-full rounded-md border-0 px-2 py-1.5 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-blue-600 aria-[invalid=true]:ring-red-500
kcInputGroup=
kcInputErrorMessageClass=mt-1 block text-sm text-red-600
kcInputHelperTextBeforeClass=mt-1 block text-xs text-gray-500
kcInputHelperTextAfterClass=mt-1 block text-xs text-gray-500
kcInputClassRadio=mt-2 flex items-center gap-2
kcInputClassRadioInput=h-4 w-4 accent-blue-600
kcInputClassRadioLabel=text-sm text-gray-700
kcInputClassCheckbox=mt-2 flex items-center gap-2
kcInputClassCheckboxInput=h-4 w-4 accent-blue-600
kcInputClassCheckboxLabel=text-sm text-gray-700
kcFormPasswordVisibilityButtonClass=hidden

kcFormClass=
kcFormSettingClass=
kcFormOptionsClass=
kcFormOptionsWrapperClass=text-sm
kcFormButtonsClass=mt-6
kcButtonClass=flex w-full cursor-pointer justify-center rounded-md bg-blue-600 px-3 py-1.5 text-sm font-semibold leading-6 text-white hover:bg-blue-500
kcButtonPrimaryClass=
kcButtonDefaultClass=
kcButtonBlockClass=
kcButtonLargeClass=

kcSignUpClass=mt-10 text-center text-sm text-gray-500
kcInfoAreaWrapperClass=
kcContentWrapperClass=
kcFormSocialAccountSectionClass=hidden
