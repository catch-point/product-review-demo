# CI for the whole repository: fast checks of each project in parallel, then
# the browser tests against the whole stack, built from the commit.
#
# Runners:
#   - "check" jobs run on any Docker-executor runner. The storage job's
#     Testcontainers tests use a Docker-in-Docker service, so that runner
#     must allow privileged services.
#   - the "e2e" job needs a runner tagged docker-host: a shell (or VM)
#     executor whose own Docker daemon publishes ports on its localhost, as
#     the realm, PUBLIC_URL and the sign-in redirects all name
#     http://localhost:3000. It must have Docker with Compose v2, bash,
#     openssl, curl, jq, python3, Node 22 and Chromium's system libraries
#     (npx playwright install-deps chromium, once, as root). It is manual
#     until that runner has picked up a job; then remove `when: manual`.
# No CI variables are needed: each e2e run generates its own secrets.

workflow:
  # A newer commit cancels a running browser job. The check jobs are not
  # interruptible, so they run to completion.
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    # A branch with an open merge request runs as that merge request only.
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

stages:
  - check
  - e2e

variables:
  MAVEN_OPTS: -Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository
  npm_config_cache: $CI_PROJECT_DIR/.npm

.maven:
  image: eclipse-temurin:25-jdk
  cache:
    key:
      files: [storage/pom.xml, storage/admin/pom.xml]
    paths: [.m2/repository]

.npm:
  cache:
    key:
      files: [presentation/package-lock.json]
    paths: [.npm]

# Unit, web-slice and Testcontainers integration tests (PostgreSQL and MinIO,
# on the Docker-in-Docker service), with JaCoCo's coverage floor.
storage:
  extends: .maven
  stage: check
  services:
    - name: docker:28.3-dind
      alias: docker
      command: ["--tls=false"]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    # Containers' ports are published on the service, not on localhost.
    TESTCONTAINERS_HOST_OVERRIDE: docker
    # The reaper container hangs against Docker-in-Docker. The service
    # disappears with the job, so nothing is left to clean up.
    TESTCONTAINERS_RYUK_DISABLED: "true"
  script:
    - cd storage
    - ./mvnw -B -ntp verify
  after_script:
    - >-
      [ -f storage/target/site/jacoco/jacoco.csv ] &&
      awk -F, 'NR > 1 { missed += $4; covered += $5 }
      END { printf "Instruction coverage: %.1f%%\n", 100 * covered / (missed + covered) }'
      storage/target/site/jacoco/jacoco.csv || true
  coverage: '/Instruction coverage: (\d+\.\d+)%/'
  artifacts:
    when: always
    expire_in: 1 week
    paths: [storage/target/site/jacoco/]
    reports:
      junit:
        - storage/target/surefire-reports/TEST-*.xml
        - storage/target/failsafe-reports/TEST-*.xml
      coverage_report:
        coverage_format: jacoco
        path: storage/target/site/jacoco/jacoco.xml

# Spring Boot Admin (storage/admin), which builds with the storage project's
# Maven wrapper.
admin:
  extends: .maven
  stage: check
  script:
    - cd storage/admin
    - ../mvnw -B -ntp verify
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit: storage/admin/target/surefire-reports/TEST-*.xml

presentation:
  extends: .npm
  image: node:22-alpine
  stage: check
  script:
    - cd presentation
    - npm ci
    - npm run lint
    - npm run typecheck
    - npm run coverage
    # Only what ships: the production dependencies.
    - npm audit --omit=dev --audit-level=high
  coverage: '/Statements\s*:\s*(\d+(?:\.\d+)?)%/'
  artifacts:
    when: always
    expire_in: 1 week
    paths: [presentation/coverage/]
    reports:
      junit: presentation/test-results/vitest-junit.xml
      coverage_report:
        coverage_format: cobertura
        path: presentation/coverage/cobertura-coverage.xml

scripts:
  image: koalaman/shellcheck-alpine:v0.11.0
  stage: check
  script:
    - shellcheck -x scripts/*.sh storage/scripts/*.sh storage/minio/init.sh identity/configure.sh

# Every compose.yaml, as the root one includes them, with generated secrets.
compose:
  image: docker:28.3-cli
  stage: check
  before_script:
    - apk add --no-cache bash openssl
  script:
    - scripts/secrets.sh
    - docker compose --env-file .env config --quiet

# The browser tests against the stack built from this commit and seeded with
# the product catalog, then a backup, a restore and an unused-image
# listing of what they left. One at a time: the
# stack's ports and its backchannel subnet are fixed.
# Manual, and optional, until a runner tagged docker-host has taken it once:
# a missing runner would otherwise sit and then fail the pipeline.
e2e:
  stage: e2e
  tags: [docker-host]
  when: manual
  timeout: 2h
  interruptible: true
  resource_group: e2e
  variables:
    COMPOSE_PROJECT_NAME: review-ci
    PLAYWRIGHT_BROWSERS_PATH: $CI_PROJECT_DIR/.cache/ms-playwright
  cache:
    - key:
        files: [presentation/package-lock.json]
      paths: [.npm, .cache/ms-playwright]
  before_script:
    # Left by a run that was cancelled before its after_script.
    - scripts/stack.sh all reset --yes || true
    - scripts/secrets.sh
    # The seed scripts sign in with development tokens.
    - echo DEV_TOKENS=true >>.env
  script:
    - scripts/stack.sh all up
    # The browser tests browse deep into the listing: hundreds of products.
    - storage/scripts/seed-products.sh
    - (cd presentation && npm ci && npx playwright install chromium && npm run e2e)
    - |
      products() { curl -sf "http://localhost:8080/products?limit=1" | jq .totalItems; }
      before=$(products)
      scripts/stack.sh storage backup "$CI_PROJECT_DIR/ci-backup"
      scripts/stack.sh storage restore "$CI_PROJECT_DIR/ci-backup"
      after=$(products)
      echo "Products before the backup: $before; after the restore: $after"
      [ "$before" -gt 0 ] && [ "$before" = "$after" ]
    - scripts/stack.sh storage prune-images
  after_script:
    - docker compose --project-directory . --env-file .env -f compose.yaml -p "$COMPOSE_PROJECT_NAME"
      logs --no-color --timestamps >stack.log 2>&1 || true
    - scripts/stack.sh all reset --yes || true
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - presentation/playwright-report/
      - presentation/test-results/
      - stack.log
    reports:
      junit: presentation/test-results/junit.xml
