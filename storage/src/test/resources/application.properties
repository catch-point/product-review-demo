# The tests' own settings, next to src/main/resources/application.yml (these
# win where both set a property). They also apply to TestStorageApplication
# (the VS Code Testcontainers launch, ./mvnw spring-boot:test-run).

# The credentials are the tests' own (TestcontainersConfiguration, or
# @SpringBootTest properties): there is no .env to require them from.
reviews.require-secrets=false
# The actuator's account (ActuatorSecurityIT signs in with it).
reviews.actuator.password=a-test-actuator-password
# The tests sign their callers' tokens with reviews.security.jwt-secret.
reviews.security.dev-tokens=true
